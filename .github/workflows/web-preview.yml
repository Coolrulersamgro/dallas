name: Dallas Web Preview

on:
  push:
    branches: [main]
    paths:
      - 'App.js'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'assets/**'
      - '.github/workflows/web-preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dallas-web-preview
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Expo web runtime
        run: npx expo install @expo/metro-runtime

      - name: Export Dallas for web
        run: npx expo export --platform web --output-dir dist

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Add Pages files
        run: |
          touch dist/.nojekyll
          cp dist/index.html dist/404.html

      - name: Upload web preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy live preview
        id: deployment
        uses: actions/deploy-pages@v4

name: Build Dallas Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'App.js'
      - 'app.json'
      - 'package.json'
      - 'eas.json'
      - '.github/workflows/android-apk.yml'
      - 'assets/dallas-logo.svg'

permissions:
  contents: write

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install JavaScript dependencies
        run: npm install

      - name: Validate Expo Android bundle
        run: npx expo export --platform android --output-dir dist

      - name: Generate app icon PNG from logo
        run: node -e "require('sharp')('assets/dallas-logo.svg').resize(512,512).png().toFile('assets/dallas-icon.png')"

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="dallas-apk-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" android/app/build/outputs/apk/release/app-release.apk \
            --title "Dallas Android APK - Build ${GITHUB_RUN_NUMBER}" \
            --notes "Install the APK directly on Android. This is a standalone APK file; no ZIP extraction is required."

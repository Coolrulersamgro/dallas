name: Build Dallas Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'App.js'
      - 'app.json'
      - 'package.json'
      - 'eas.json'
      - '.github/workflows/android-apk.yml'
      - 'assets/dallas-logo.svg'

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install JavaScript dependencies
        run: npm install

      - name: Generate app icon PNG from logo
        run: node -e "require('sharp')('assets/dallas-logo.svg').resize(512,512).png().toFile('assets/dallas-icon.png')"

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dallas-Android-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
